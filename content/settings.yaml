# Глобальные числа баланса. Меняйте свободно: игра подхватит изменения на лету.
version: "0.1.0"
season: winter
startMoney: 60
pullPerHorse: 2.5        # миль за шаг на лошадь при полной стамине
feedPerHorse: 2          # деньги на корм за шаг на лошадь
travelFatigue: 4         # усталость за шаг дороги
hungerFatigue: 8         # доп. усталость, если не хватило на корм
threatStartDistance: 25  # мили между угрозой и караваном на старте
threatSpeed: 5.5         # миль за шаг
threatAcceleration: 0.1  # прирост скорости угрозы за шаг
huntPushback: 12         # на сколько отступает угроза, забрав лошадь
townRest: 30             # стамина, восстановленная по прибытии в город
showIncome: 40           # базовый доход шоу (× богатство × средняя стамина × √лошадей)
showFatigue: 15          # усталость за одно шоу
